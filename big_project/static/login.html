<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames — Sign in</title>
    <link rel="stylesheet" href="/static/css/frames.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-wrap {
            width: 100%;
            max-width: 360px;
        }
        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .login-logo img { height: 48px; }
        .login-card {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            padding: 2rem;
        }
        .login-card h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 0.25rem;
        }
        .login-card p {
            font-size: 0.875rem;
            color: #888;
            margin: 0 0 1.5rem;
        }
        .login-card .btn-primary {
            width: 100%;
            padding: 0.65rem;
            font-size: 0.95rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-logo">
            <img src="/static/images/logo.svg" alt="Frames" height="48">
        </div>
        <div class="login-card">
            <h1>Sign in</h1>
            <p>Enter your credentials to continue</p>

            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

            <button class="btn btn-primary" onclick="handleLogin()">Sign in</button>
            <p class="msg-error" id="error-msg" style="display:none;">Invalid email or password.</p>
        </div>
    </div>

    <script>
        document.addEventListener("keydown", e => {
            if (e.key === "Enter") handleLogin();
        });

        async function handleLogin() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const response = await fetch("/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            if (response.ok) {
                const data = await response.json();
                window.location.href = data.role === "admin" ? "/admin" : "/dashboard";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
    </script>
</body>
</html>
