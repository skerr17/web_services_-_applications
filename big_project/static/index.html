<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 { margin-bottom: 8px; }
        p.subtitle { color: #888; margin-top: 0; }

        form {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #555; }

        #album-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #album-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        #album-list li span { font-size: 13px; color: #aaa; }
        .delete-btn {
            background: none;
            border: 1px solid #ddd;
            color: #999;
            padding: 4px 10px;
            font-size: 12px;
        }
        .delete-btn:hover { background: #fee; color: #c00; border-color: #fcc; }
        #message { font-size: 13px; color: #888; margin-bottom: 16px; min-height: 20px; }
    </style>
</head>
<body>

    <h1>Frames</h1>
    <p class="subtitle">Your photo albums</p>

    <form id="create-form">
        <input type="text" id="album-name" placeholder="New album name" required>
        <button type="submit">Create album</button>
    </form>

    <p id="message"></p>
    <ul id="album-list"></ul>

    <script>
        const list    = document.getElementById("album-list")
        const message = document.getElementById("message")
        const form    = document.getElementById("create-form")
        const nameInput = document.getElementById("album-name")

        // --- Load all albums ---
        function loadAlbums() {
            fetch("/albums")
                .then(r => r.json())
                .then(albums => {
                    list.innerHTML = ""
                    if (albums.length === 0) {
                        message.textContent = "No albums yet — create one above."
                        return
                    }
                    message.textContent = ""
                albums.forEach(album => {
                    const li = document.createElement("li")
                    li.innerHTML = `
                        <div>
                            <strong><a href="/album?id=${album.id}">${album.name}</a></strong>
                            <span> &nbsp;created ${album.created_at}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteAlbum(${album.id})">Delete</button>
                    `
                    list.appendChild(li)
                })
                })
        }

        // --- Create an album ---
        form.addEventListener("submit", function(e) {
            e.preventDefault()
            fetch("/albums", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: nameInput.value })
            })
            .then(r => r.json())
            .then(() => {
                nameInput.value = ""
                loadAlbums()
            })
        })

        // --- Delete an album ---
        function deleteAlbum(id) {
            if (!confirm("Delete this album and all its photos?")) return
            fetch(`/albums/${id}`, { method: "DELETE" })
                .then(() => loadAlbums())
        }

        // Load on page open
        loadAlbums()
    </script>

</body>
</html>
