<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frames — Admin</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.1rem; margin-top: 2rem; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        input { padding: 0.5rem; margin: 0.3rem 0; width: 100%; box-sizing: border-box; }
        .form-box { background: #f9f9f9; padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
        .error { color: red; font-size: 0.9rem; }
        .success { color: green; font-size: 0.9rem; }

        /* Album list */
        .album-list { list-style: none; padding: 0; }
        .album-item { background: white; border: 1px solid #ddd; border-radius: 6px;
                      padding: 1rem; margin-bottom: 0.5rem; }
        .album-footer { display: flex; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
        .album-footer select { flex: 1; padding: 0.4rem; border: 1px solid #ddd; border-radius: 4px; }
        .album-footer button { font-size: 0.85rem; padding: 0.4rem 0.75rem; }
        .assigned { color: #888; font-size: 0.85rem; margin: 0.25rem 0 0; }

        /* QR table */
        .qr-table-wrap { overflow-x: auto; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; font-weight: 500; font-size: 0.8rem; color: #888;
             padding: 0 12px 8px; border-bottom: 1px solid #eee; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .token { font-family: monospace; background: #f3f3f3; padding: 3px 7px;
                 border-radius: 4px; font-size: 0.85rem; }
        .target { font-family: monospace; font-size: 0.85rem; color: #555; }
        .update-row { display: flex; gap: 6px; align-items: center; }
        .update-row input { width: 180px; padding: 0.35rem 0.5rem; font-size: 0.85rem;
                            border: 1px solid #ddd; border-radius: 4px; margin: 0; }
        .update-row button { padding: 0.35rem 0.75rem; font-size: 0.85rem; white-space: nowrap; }
        .qr-msg { font-size: 0.8rem; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Frames — Admin</h1>
        <button onclick="handleLogout()">Logout</button>
    </div>

    <!-- Create Album Form -->
    <div class="form-box">
        <h2 style="margin-top:0">Create Album</h2>
        <input type="text" id="album-name" placeholder="Album name (required)">
        <input type="text" id="album-desc" placeholder="Description (optional)">
        <input type="date" id="album-date">
        <input type="text" id="album-slug" placeholder="Slug e.g. johns-wedding">
        <button onclick="createAlbum()">Create Album</button>
        <p class="error" id="album-error"></p>
    </div>

    <!-- Create Organiser Form -->
    <div class="form-box">
        <h2 style="margin-top:0">Create Organiser Account</h2>
        <input type="email" id="org-email" placeholder="Email address">
        <input type="password" id="org-password" placeholder="Temporary password">
        <button onclick="createOrganiser()">Create Organiser</button>
        <p class="error" id="org-error"></p>
        <p class="success" id="org-success"></p>
    </div>

    <!-- Album List -->
    <h2>All Albums</h2>
    <ul class="album-list" id="album-list">
        <li>Loading...</li>
    </ul>

    <!-- QR Redirects Table -->
    <h2>QR Redirects</h2>
    <div class="qr-table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Album</th>
                    <th>Permanent token URL</th>
                    <th>Currently points to</th>
                    <th>Update target</th>
                </tr>
            </thead>
            <tbody id="qr-table-body">
                <tr><td colspan="4">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadAll);

        async function loadAll() {
            const [albumRes, orgRes] = await Promise.all([
                fetch("/albums"),
                fetch("/users")
            ]);
            const albums = await albumRes.json();
            const organisers = await orgRes.json();

            // Fetch QR data for all albums in parallel
            const qrResults = await Promise.all(
                albums.map(a => fetch(`/qr/${a.id}`).then(r => r.ok ? r.json() : null))
            );

            const qrMap = {};
            qrResults.forEach((qr, i) => {
                if (qr) qrMap[albums[i].id] = qr;
            });

            renderAlbums(albums, organisers);
            renderQrTable(albums, qrMap);
        }

        function renderAlbums(albums, organisers) {
            const list = document.getElementById("album-list");
            if (albums.length === 0) {
                list.innerHTML = "<li>No albums yet.</li>";
                return;
            }
            const orgOptions = `
                <option value="">— Select organiser —</option>
                ${organisers.map(o => `<option value="${o.id}">${o.email}</option>`).join("")}
            `;
            list.innerHTML = albums.map(album => {
                const assigned = organisers.find(o => o.id === album.organiser_id);
                const assignedLabel = assigned
                    ? `Assigned to: <strong>${assigned.email}</strong>`
                    : "No organiser assigned";
                return `
                    <li class="album-item">
                        <strong>${album.name}</strong> — ${album.event_date || "No date"}<br>
                        <small>Slug: ${album.slug} | Created: ${album.created_at}</small>
                        <p class="assigned">${assignedLabel}</p>
                        <div class="album-footer">
                            <select id="select-${album.id}">${orgOptions}</select>
                            <button onclick="assignOrganiser(${album.id})">Assign</button>
                        </div>
                    </li>
                `;
            }).join("");
        }

        function renderQrTable(albums, qrMap) {
            const tbody = document.getElementById("qr-table-body");
            const base = window.location.origin;

            if (albums.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4'>No albums yet.</td></tr>";
                return;
            }

            tbody.innerHTML = albums.map(album => {
                const qr = qrMap[album.id];
                if (!qr) return `
                    <tr>
                        <td>${album.name}</td>
                        <td colspan="3" style="color:#aaa;">No redirect generated</td>
                    </tr>
                `;
                return `
                    <tr>
                        <td>${album.name}</td>
                        <td><span class="token">${base}/r/${qr.token}</span></td>
                        <td><span class="target">${qr.target_url}</span></td>
                        <td>
                            <div class="update-row">
                                <input type="text" id="qr-input-${album.id}" 
                                       placeholder="e.g. /upload/${album.slug}">
                                <button onclick="updateQr(${album.id})">Update</button>
                            </div>
                            <p class="qr-msg success" id="qr-ok-${album.id}"></p>
                            <p class="qr-msg error" id="qr-err-${album.id}"></p>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        async function updateQr(albumId) {
            const input = document.getElementById(`qr-input-${albumId}`);
            const targetUrl = input.value.trim();
            const okEl = document.getElementById(`qr-ok-${albumId}`);
            const errEl = document.getElementById(`qr-err-${albumId}`);

            if (!targetUrl) {
                errEl.textContent = "Please enter a target URL.";
                return;
            }

            const response = await fetch(`/qr/${albumId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ target_url: targetUrl })
            });

            if (response.ok) {
                okEl.textContent = "Redirect updated.";
                errEl.textContent = "";
                input.value = "";
                loadAll(); // Reload to show new target in table
            } else {
                const data = await response.json();
                errEl.textContent = data.error || "Failed to update.";
                okEl.textContent = "";
            }
        }

        async function assignOrganiser(albumId) {
            const select = document.getElementById(`select-${albumId}`);
            const organiserId = select.value;
            if (!organiserId) { alert("Please select an organiser first."); return; }
            const response = await fetch(`/albums/${albumId}/assign`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ organiser_id: parseInt(organiserId) })
            });
            if (response.ok) { loadAll(); }
            else { const data = await response.json(); alert(data.error || "Failed to assign."); }
        }

        async function createAlbum() {
            const name = document.getElementById("album-name").value.trim();
            const description = document.getElementById("album-desc").value.trim();
            const event_date = document.getElementById("album-date").value;
            const slug = document.getElementById("album-slug").value.trim();
            const errorEl = document.getElementById("album-error");
            if (!name || !slug) { errorEl.textContent = "Name and slug are required."; return; }
            const response = await fetch("/albums", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, description, event_date, slug })
            });
            if (response.ok) {
                document.getElementById("album-name").value = "";
                document.getElementById("album-desc").value = "";
                document.getElementById("album-date").value = "";
                document.getElementById("album-slug").value = "";
                errorEl.textContent = "";
                loadAll();
            } else {
                const data = await response.json();
                errorEl.textContent = data.error || "Failed to create album.";
            }
        }

        async function createOrganiser() {
            const email = document.getElementById("org-email").value.trim();
            const password = document.getElementById("org-password").value.trim();
            const errorEl = document.getElementById("org-error");
            const successEl = document.getElementById("org-success");
            if (!email || !password) {
                errorEl.textContent = "Email and password are required.";
                successEl.textContent = "";
                return;
            }
            const response = await fetch("/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            if (response.ok) {
                document.getElementById("org-email").value = "";
                document.getElementById("org-password").value = "";
                errorEl.textContent = "";
                successEl.textContent = `Organiser ${email} created successfully.`;
                loadAll();
            } else {
                const data = await response.json();
                successEl.textContent = "";
                errorEl.textContent = data.error || "Failed to create organiser.";
            }
        }

        async function handleLogout() {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/";
        }
    </script>

</body>
</html>
