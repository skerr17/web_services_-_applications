<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames — Admin</title>
    <link rel="stylesheet" href="/static/css/frames.css">
</head>
<body>

    <div class="top-bar">
        <a class="logo" href="/admin">
            <img src="/static/images/logo.svg" alt="Frames">
        </a>
        <nav>
            <button class="btn btn-ghost" onclick="handleLogout()">Sign out</button>
        </nav>
    </div>

    <div class="page">

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:2rem;">

            <!-- Create Album -->
            <div class="card">
                <h2>Create album</h2>
                <label>Album name</label>
                <input type="text" id="album-name" placeholder="e.g. Smith Wedding" oninput="autoSlug()">
                <label>Description</label>
                <input type="text" id="album-desc" placeholder="Optional">
                <label>Event date</label>
                <input type="date" id="album-date">
                <p class="slug-hint">Slug (auto-generated, editable)</p>
                <input type="text" id="album-slug" placeholder="e.g. smith-wedding">
                <button class="btn btn-primary" onclick="createAlbum()" style="width:100%;">Create album</button>
                <p class="msg-error" id="album-error"></p>
            </div>

            <!-- Create Organiser -->
            <div class="card">
                <h2>Create organiser account</h2>
                <label>Email address</label>
                <input type="email" id="org-email" placeholder="organiser@example.com">
                <label>Temporary password</label>
                <input type="password" id="org-password" placeholder="••••••••">
                <button class="btn btn-primary" onclick="createOrganiser()" style="width:100%;">Create organiser</button>
                <p class="msg-error" id="org-error"></p>
                <p class="msg-success" id="org-success"></p>
            </div>

        </div>

        <div class="section-header">
            <h2>All albums</h2>
        </div>
        <ul class="album-list" id="album-list"><li>Loading...</li></ul>

        <div class="section-header">
            <h2>All organisers</h2>
        </div>
        <ul class="org-list" id="org-list"><li>Loading...</li></ul>

        <div class="section-header">
            <h2>QR redirects</h2>
        </div>
        <div class="qr-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Album</th>
                        <th>Permanent token URL</th>
                        <th>Currently points to</th>
                        <th>Redirect to</th>
                    </tr>
                </thead>
                <tbody id="qr-table-body">
                    <tr><td colspan="4">Loading...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        let allAlbums = [];

        document.addEventListener("DOMContentLoaded", loadAll);

        function autoSlug() {
            const name = document.getElementById("album-name").value;
            document.getElementById("album-slug").value = name
                .toLowerCase().trim()
                .replace(/[^a-z0-9\s-]/g, "")
                .replace(/\s+/g, "-")
                .replace(/-+/g, "-");
        }

        async function loadAll() {
            const [albumRes, orgRes] = await Promise.all([fetch("/albums"), fetch("/users")]);
            allAlbums = await albumRes.json();
            const organisers = await orgRes.json();

            const qrResults = await Promise.all(
                allAlbums.map(a => fetch(`/qr/${a.id}`).then(r => r.ok ? r.json() : null))
            );
            const qrMap = {};
            qrResults.forEach((qr, i) => { if (qr) qrMap[allAlbums[i].id] = qr; });

            renderAlbums(allAlbums, organisers);
            renderOrganisers(organisers, allAlbums);
            renderQrTable(allAlbums, qrMap);
        }

        function renderAlbums(albums, organisers) {
            const list = document.getElementById("album-list");
            if (albums.length === 0) { list.innerHTML = "<li class='msg-muted'>No albums yet.</li>"; return; }
            const orgOptions = `<option value="">— Select organiser —</option>
                ${organisers.map(o => `<option value="${o.id}">${o.email}</option>`).join("")}`;
            list.innerHTML = albums.map(album => {
                const assigned = organisers.find(o => o.id === album.organiser_id);
                const assignedLabel = assigned
                    ? `Assigned to: <strong>${assigned.email}</strong>`
                    : "No organiser assigned";
                return `
                    <li class="album-item">
                        <strong>${album.name}</strong> &mdash; ${album.event_date || "No date"}<br>
                        <small>Slug: ${album.slug} | Created: ${album.created_at}</small>
                        <p class="assigned">${assignedLabel}</p>
                        <div class="album-actions">
                            <a class="btn btn-secondary" href="/album?id=${album.id}">View album</a>
                            <button class="btn btn-danger" data-id="${album.id}" onclick="deleteAlbum(this)">Delete</button>
                        </div>
                        <div class="album-footer">
                            <select id="select-${album.id}">${orgOptions}</select>
                            <button class="btn btn-secondary" onclick="assignOrganiser(${album.id})">Assign</button>
                        </div>
                    </li>`;
            }).join("");
        }

        function renderOrganisers(organisers, albums) {
            const list = document.getElementById("org-list");
            if (organisers.length === 0) { list.innerHTML = "<li class='msg-muted'>No organisers yet.</li>"; return; }
            list.innerHTML = organisers.map(org => {
                const assignedAlbum = albums.find(a => a.organiser_id === org.id);
                const albumLabel = assignedAlbum
                    ? `Assigned to: <strong>${assignedAlbum.name}</strong>`
                    : "No album assigned";
                return `
                    <li class="org-item">
                        <span>${org.email} &mdash; <small>${albumLabel}</small></span>
                        <button class="btn btn-danger" data-id="${org.id}" onclick="deleteOrganiser(this)">Delete</button>
                    </li>`;
            }).join("");
        }

        function renderQrTable(albums, qrMap) {
            const tbody = document.getElementById("qr-table-body");
            const base = window.location.origin;
            if (albums.length === 0) { tbody.innerHTML = "<tr><td colspan='4'>No albums yet.</td></tr>"; return; }
            tbody.innerHTML = albums.map(album => {
                const qr = qrMap[album.id];
                if (!qr) return `<tr><td>${album.name}</td><td colspan="3" style="color:#aaa;">No redirect generated</td></tr>`;
                const albumOptions = albums.map(a =>
                    `<option value="/upload/${a.slug}" ${qr.target_url === `/upload/${a.slug}` ? "selected" : ""}>${a.name}</option>`
                ).join("");
                return `
                    <tr>
                        <td>${album.name}</td>
                        <td><span class="token">${base}/r/${qr.token}</span></td>
                        <td><span class="target">${qr.target_url}</span></td>
                        <td>
                            <div class="update-row">
                                <select id="qr-input-${album.id}">${albumOptions}</select>
                                <button class="btn btn-secondary" onclick="updateQr(${album.id})">Update</button>
                            </div>
                            <p class="qr-msg msg-success" id="qr-ok-${album.id}"></p>
                            <p class="qr-msg msg-error" id="qr-err-${album.id}"></p>
                        </td>
                    </tr>`;
            }).join("");
        }

        async function deleteAlbum(btn) {
            const albumId = btn.dataset.id;
            if (!confirm("Delete this album? This will also delete all its photos.")) return;
            const res = await fetch(`/albums/${albumId}`, { method: "DELETE" });
            if (res.ok) loadAll();
            else alert("Failed to delete album.");
        }

        async function deleteOrganiser(btn) {
            const organiserId = btn.dataset.id;
            if (!confirm("Delete this organiser? This cannot be undone.")) return;
            const res = await fetch(`/users/${organiserId}`, { method: "DELETE" });
            if (res.ok) loadAll();
            else { const data = await res.json(); alert(data.error || "Failed to delete organiser."); }
        }

        async function updateQr(albumId) {
            const select = document.getElementById(`qr-input-${albumId}`);
            const okEl = document.getElementById(`qr-ok-${albumId}`);
            const errEl = document.getElementById(`qr-err-${albumId}`);
            const res = await fetch(`/qr/${albumId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ target_url: select.value })
            });
            if (res.ok) { okEl.textContent = "Redirect updated."; errEl.textContent = ""; loadAll(); }
            else { const data = await res.json(); errEl.textContent = data.error || "Failed."; okEl.textContent = ""; }
        }

        async function assignOrganiser(albumId) {
            const select = document.getElementById(`select-${albumId}`);
            const organiserId = select.value;
            if (!organiserId) { alert("Please select an organiser first."); return; }
            const res = await fetch(`/albums/${albumId}/assign`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ organiser_id: parseInt(organiserId) })
            });
            if (res.ok) loadAll();
            else { const data = await res.json(); alert(data.error || "Failed to assign."); }
        }

        async function createAlbum() {
            const name = document.getElementById("album-name").value.trim();
            const description = document.getElementById("album-desc").value.trim();
            const event_date = document.getElementById("album-date").value;
            const slug = document.getElementById("album-slug").value.trim();
            const errorEl = document.getElementById("album-error");
            if (!name || !slug) { errorEl.textContent = "Name and slug are required."; return; }
            const res = await fetch("/albums", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, description, event_date, slug })
            });
            if (res.ok) {
                ["album-name","album-desc","album-date","album-slug"].forEach(id => document.getElementById(id).value = "");
                errorEl.textContent = "";
                loadAll();
            } else { const data = await res.json(); errorEl.textContent = data.error || "Failed to create album."; }
        }

        async function createOrganiser() {
            const email = document.getElementById("org-email").value.trim();
            const password = document.getElementById("org-password").value.trim();
            const errorEl = document.getElementById("org-error");
            const successEl = document.getElementById("org-success");
            if (!email || !password) { errorEl.textContent = "Email and password are required."; successEl.textContent = ""; return; }
            const res = await fetch("/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            if (res.ok) {
                document.getElementById("org-email").value = "";
                document.getElementById("org-password").value = "";
                errorEl.textContent = "";
                successEl.textContent = `Organiser ${email} created successfully.`;
                loadAll();
            } else { const data = await res.json(); successEl.textContent = ""; errorEl.textContent = data.error || "Failed to create organiser."; }
        }

        async function handleLogout() {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/";
        }
    </script>
</body>
</html>
