<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frames — Admin</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.5rem; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        input { padding: 0.5rem; margin: 0.3rem 0; width: 100%; box-sizing: border-box; }
        .form-box { background: #f9f9f9; padding: 1rem; border-radius: 6px; margin-bottom: 2rem; }
        .album-list { list-style: none; padding: 0; }
        .album-item { background: white; border: 1px solid #ddd; border-radius: 6px; 
                      padding: 1rem; margin-bottom: 0.5rem; }
        .album-footer { display: flex; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
        .album-footer select { flex: 1; padding: 0.4rem; border: 1px solid #ddd; border-radius: 4px; }
        .album-footer button { font-size: 0.85rem; padding: 0.4rem 0.75rem; }
        .error { color: red; font-size: 0.9rem; }
        .success { color: green; font-size: 0.9rem; }
        .assigned { color: #888; font-size: 0.85rem; margin-top: 0.25rem; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Frames — Admin</h1>
        <button onclick="handleLogout()">Logout</button>
    </div>

    <!-- Create Album Form -->
    <div class="form-box">
        <h2>Create Album</h2>
        <input type="text" id="album-name" placeholder="Album name (required)">
        <input type="text" id="album-desc" placeholder="Description (optional)">
        <input type="date" id="album-date">
        <input type="text" id="album-slug" placeholder="Slug e.g. johns-wedding">
        <button onclick="createAlbum()">Create Album</button>
        <p class="error" id="album-error"></p>
    </div>

    <!-- Create Organiser Form -->
    <div class="form-box">
        <h2>Create Organiser Account</h2>
        <input type="email" id="org-email" placeholder="Email address">
        <input type="password" id="org-password" placeholder="Temporary password">
        <button onclick="createOrganiser()">Create Organiser</button>
        <p class="error" id="org-error"></p>
        <p class="success" id="org-success"></p>
    </div>

    <!-- Album List -->
    <h2>All Albums</h2>
    <ul class="album-list" id="album-list">
        <li>Loading...</li>
    </ul>

    <script>
        document.addEventListener("DOMContentLoaded", loadAll);

        // Load both albums and organisers together so we can build the dropdowns
        async function loadAll() {
            const [albumRes, orgRes] = await Promise.all([
                fetch("/albums"),
                fetch("/users")
            ]);
            const albums = await albumRes.json();
            const organisers = await orgRes.json();
            renderAlbums(albums, organisers);
        }

        function renderAlbums(albums, organisers) {
            const list = document.getElementById("album-list");

            if (albums.length === 0) {
                list.innerHTML = "<li>No albums yet.</li>";
                return;
            }

            // Build the organiser options HTML once, reuse in each album row
            const orgOptions = `
                <option value="">— Select organiser —</option>
                ${organisers.map(o => `<option value="${o.id}">${o.email}</option>`).join("")}
            `;

            list.innerHTML = albums.map(album => {
                // Work out who is currently assigned (if anyone)
                const assigned = organisers.find(o => o.id === album.organiser_id);
                const assignedLabel = assigned
                    ? `Currently assigned to: <strong>${assigned.email}</strong>`
                    : "No organiser assigned";

                return `
                    <li class="album-item">
                        <strong>${album.name}</strong> — ${album.event_date || "No date"}<br>
                        <small>Slug: ${album.slug} | Created: ${album.created_at}</small>
                        <p class="assigned" id="assigned-${album.id}">${assignedLabel}</p>
                        <div class="album-footer">
                            <select id="select-${album.id}">
                                ${orgOptions}
                            </select>
                            <button onclick="assignOrganiser(${album.id})">Assign</button>
                        </div>
                    </li>
                `;
            }).join("");
        }

        async function assignOrganiser(albumId) {
            const select = document.getElementById(`select-${albumId}`);
            const organiserId = select.value;

            if (!organiserId) {
                alert("Please select an organiser first.");
                return;
            }

            const response = await fetch(`/albums/${albumId}/assign`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ organiser_id: parseInt(organiserId) })
            });

            if (response.ok) {
                // Reload the list to show the updated assignment
                loadAll();
            } else {
                const data = await response.json();
                alert(data.error || "Failed to assign organiser.");
            }
        }

        async function createAlbum() {
            const name = document.getElementById("album-name").value.trim();
            const description = document.getElementById("album-desc").value.trim();
            const event_date = document.getElementById("album-date").value;
            const slug = document.getElementById("album-slug").value.trim();
            const errorEl = document.getElementById("album-error");

            if (!name || !slug) {
                errorEl.textContent = "Name and slug are required.";
                return;
            }

            const response = await fetch("/albums", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, description, event_date, slug })
            });

            if (response.ok) {
                document.getElementById("album-name").value = "";
                document.getElementById("album-desc").value = "";
                document.getElementById("album-date").value = "";
                document.getElementById("album-slug").value = "";
                errorEl.textContent = "";
                loadAll();
            } else {
                const data = await response.json();
                errorEl.textContent = data.error || "Failed to create album.";
            }
        }

        async function createOrganiser() {
            const email = document.getElementById("org-email").value.trim();
            const password = document.getElementById("org-password").value.trim();
            const errorEl = document.getElementById("org-error");
            const successEl = document.getElementById("org-success");

            if (!email || !password) {
                errorEl.textContent = "Email and password are required.";
                successEl.textContent = "";
                return;
            }

            const response = await fetch("/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                document.getElementById("org-email").value = "";
                document.getElementById("org-password").value = "";
                errorEl.textContent = "";
                successEl.textContent = `Organiser ${email} created successfully.`;
                loadAll(); // Reload so new organiser appears in dropdowns
            } else {
                const data = await response.json();
                successEl.textContent = "";
                errorEl.textContent = data.error || "Failed to create organiser.";
            }
        }

        async function handleLogout() {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/login";
        }
    </script>

</body>
</html>
