<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames — Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.5rem; }
        .album-info { background: #f9f9f9; padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
        .album-info p { margin: 0.25rem 0; color: #555; }

        .action-row { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .action-row button, .action-row a {
            font-size: 0.85rem; padding: 0.4rem 0.9rem; border-radius: 4px;
            cursor: pointer; text-decoration: none; border: 1px solid #ccc;
            background: white; color: #333;
        }
        .action-row button:hover, .action-row a:hover { background: #f5f5f5; }
        .copy-confirm { font-size: 0.8rem; color: green; opacity: 0; transition: opacity 0.3s; }
        .copy-confirm.show { opacity: 1; }

        .qr-label { font-size: 0.8rem; color: #888; margin: 0 0 0.5rem; }

        #status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .photo-card { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; background: white; }
        .photo-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
        .photo-actions { display: flex; gap: 0.5rem; padding: 0.5rem; }
        .photo-actions a, .photo-actions button {
            flex: 1; padding: 0.4rem; font-size: 0.8rem;
            text-align: center; border-radius: 4px; cursor: pointer; text-decoration: none;
        }
        .photo-actions a { background: #333; color: white; border: none; }
        .photo-actions button { background: white; color: #c00; border: 1px solid #fcc; }
        .photo-actions button:hover { background: #fee; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Frames — My Album</h1>
        <button onclick="handleLogout()">Logout</button>
    </div>

    <div class="album-info" id="album-info">Loading...</div>

    <div class="action-row">
        <button onclick="copyLink()">Copy guest link</button>
        <span class="copy-confirm" id="copy-confirm">Copied!</span>
        <a id="qr-download" download="frames-qr.png">Download QR</a>
    </div>

    <p class="qr-label">Scan to upload photos</p>
    <img id="qr-img" src="" alt="QR code" style="width:160px; height:160px; display:block; margin-bottom:2rem;">

    <p id="status"></p>
    <div class="photo-grid" id="photo-grid"></div>

    <script>
        let albumId = null;
        let shareUrl = "";

        document.addEventListener("DOMContentLoaded", loadDashboard);

        async function loadDashboard() {
            const albumRes = await fetch("/my-album");

            if (!albumRes.ok) {
                document.getElementById("album-info").textContent = "No album assigned to your account yet.";
                return;
            }

            const album = await albumRes.json();
            albumId = album.id;

            document.getElementById("album-info").innerHTML = `
                <strong>${album.name}</strong>
                <p>${album.description || "No description"}</p>
                <p>Date: ${album.event_date || "Not set"}</p>
            `;

            const qrUrl = `/albums/${album.id}/qr?t=${Date.now()}`;
            document.getElementById("qr-img").src = qrUrl;
            document.getElementById("qr-download").href = qrUrl;

            // Fetch live redirect target so share URL stays in sync
            const qrRes = await fetch(`/qr/${album.id}`);
            if (qrRes.ok) {
                const qr = await qrRes.json();
                shareUrl = `${window.location.origin}${qr.target_url}`;
            }

            loadPhotos();
        }

        function copyLink() {
            if (!shareUrl) return;
            navigator.clipboard.writeText(shareUrl).then(() => {
                const el = document.getElementById("copy-confirm");
                el.classList.add("show");
                setTimeout(() => el.classList.remove("show"), 2000);
            });
        }

        async function loadPhotos() {
            const response = await fetch(`/albums/${albumId}/photos`);
            const photos = await response.json();
            const grid = document.getElementById("photo-grid");
            const status = document.getElementById("status");

            if (photos.length === 0) {
                status.textContent = "No photos uploaded yet.";
                grid.innerHTML = "";
                return;
            }

            status.textContent = `${photos.length} photo(s)`;

            grid.innerHTML = photos.map(photo => `
                <div class="photo-card" id="card-${photo.id}">
                    <img src="/static/uploads/${photo.filename}" alt="photo">
                    <div class="photo-actions">
                        <a href="/static/uploads/${photo.filename}" download="${photo.filename}">
                            Download
                        </a>
                        <button onclick="deletePhoto(${photo.id})">Delete</button>
                    </div>
                </div>
            `).join("");
        }

        async function deletePhoto(photoId) {
            if (!confirm("Delete this photo?")) return;
            const response = await fetch(`/photos/${photoId}`, { method: "DELETE" });
            if (response.ok) {
                document.getElementById(`card-${photoId}`).remove();
            } else {
                alert("Failed to delete photo.");
            }
        }

        async function handleLogout() {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/";
        }
    </script>

</body>
</html>
