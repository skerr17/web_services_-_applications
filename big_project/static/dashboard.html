<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames — Dashboard</title>
    <link rel="stylesheet" href="/static/css/frames.css">
</head>
<body>

    <div class="top-bar">
        <a class="logo" href="/dashboard">
            <img src="/static/images/logo.svg" alt="Frames">
        </a>
        <nav>
            <button class="btn btn-ghost" onclick="handleLogout()">Sign out</button>
        </nav>
    </div>

    <div class="page">

        <div class="album-info" id="album-info">
            <p class="album-meta">Loading...</p>
        </div>

        <div class="action-row">
            <button class="btn btn-secondary" onclick="copyLink()">Copy guest link</button>
            <span class="copy-confirm" id="copy-confirm">Copied!</span>
            <a class="btn btn-secondary" id="qr-download" download="frames-qr.png">Download QR</a>
        </div>

        <p class="qr-label">Scan to upload photos</p>
        <img id="qr-img" src="" alt="QR code" style="width:160px; height:160px; display:block; margin-bottom:2rem; border-radius:8px;">

        <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;">
            <label class="file-label" style="margin:0; flex:1; text-align:left; padding:0.5rem 0.75rem;">
                Choose photos to upload
                <input type="file" id="photo-input" accept="image/*" multiple>
            </label>
            <button class="btn btn-primary" onclick="uploadPhotos()" style="white-space:nowrap;">Upload</button>
        </div>
        <p id="upload-msg" class="msg-muted" style="margin-bottom:1.5rem;"></p>

        <div class="section-header">
            <h2 id="status">Photos</h2>
        </div>

        <div class="photo-grid" id="photo-grid"></div>

    </div>

    <script>
        let albumId = null;
        let shareUrl = "";

        document.addEventListener("DOMContentLoaded", loadDashboard);

        async function loadDashboard() {
            const albumRes = await fetch("/my-album");
            if (!albumRes.ok) {
                document.getElementById("album-info").innerHTML =
                    '<p class="album-meta">No album assigned to your account yet.</p>';
                return;
            }
            const album = await albumRes.json();
            albumId = album.id;

            document.getElementById("album-info").innerHTML = `
                <p class="album-name">${album.name}</p>
                <p class="album-meta">${album.description || "No description"} &mdash; ${album.event_date || "Date not set"}</p>
            `;

            const qrUrl = `/albums/${album.id}/qr?t=${Date.now()}`;
            document.getElementById("qr-img").src = qrUrl;
            document.getElementById("qr-download").href = qrUrl;

            const qrRes = await fetch(`/qr/${album.id}`);
            if (qrRes.ok) {
                const qr = await qrRes.json();
                shareUrl = `${window.location.origin}${qr.target_url}`;
            }

            loadPhotos();
        }

        function copyLink() {
            if (!shareUrl) return;
            navigator.clipboard.writeText(shareUrl).then(() => {
                const el = document.getElementById("copy-confirm");
                el.classList.add("show");
                setTimeout(() => el.classList.remove("show"), 2000);
            });
        }

        async function uploadPhotos() {
            const fileInput = document.getElementById("photo-input");
            const msgEl = document.getElementById("upload-msg");
            if (!fileInput.files.length) { msgEl.textContent = "Please select at least one file."; return; }
            const files = Array.from(fileInput.files);
            msgEl.textContent = `Uploading ${files.length} photo(s)...`;
            let uploaded = 0;
            for (const file of files) {
                const formData = new FormData();
                formData.append("photo", file);
                const res = await fetch(`/albums/${albumId}/photos`, { method: "POST", body: formData });
                if (res.ok) uploaded++;
            }
            fileInput.value = "";
            msgEl.textContent = `${uploaded} of ${files.length} photo(s) uploaded.`;
            setTimeout(() => msgEl.textContent = "", 3000);
            loadPhotos();
        }

        async function loadPhotos() {
            const response = await fetch(`/albums/${albumId}/photos`);
            const photos = await response.json();
            const grid = document.getElementById("photo-grid");
            const status = document.getElementById("status");

            if (photos.length === 0) {
                status.textContent = "Photos";
                grid.innerHTML = '<p class="msg-muted">No photos uploaded yet.</p>';
                return;
            }

            status.textContent = `${photos.length} photo(s)`;
            grid.innerHTML = photos.map(photo => `
                <div class="photo-card" id="card-${photo.id}">
                    <img src="/static/uploads/${photo.filename}" alt="photo">
                    <div class="photo-actions">
                        <a href="/static/uploads/${photo.filename}" download="${photo.filename}">Download</a>
                        <button onclick="deletePhoto(${photo.id})">Delete</button>
                    </div>
                </div>
            `).join("");
        }

        async function deletePhoto(photoId) {
            if (!confirm("Delete this photo?")) return;
            const response = await fetch(`/photos/${photoId}`, { method: "DELETE" });
            if (response.ok) document.getElementById(`card-${photoId}`).remove();
            else alert("Failed to delete photo.");
        }

        async function handleLogout() {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/";
        }
    </script>
</body>
</html>
