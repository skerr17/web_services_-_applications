<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames — Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.5rem; }
        .album-info { background: #f9f9f9; padding: 1rem; border-radius: 6px; margin-bottom: 2rem; }
        .album-info p { margin: 0.25rem 0; color: #555; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .photo-card { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; background: white; }
        .photo-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
        .photo-actions { display: flex; gap: 0.5rem; padding: 0.5rem; }
        .photo-actions a, .photo-actions button {
            flex: 1; padding: 0.4rem; font-size: 0.8rem;
            text-align: center; border-radius: 4px; cursor: pointer; text-decoration: none;
        }
        .photo-actions a { background: #333; color: white; border: none; }
        .photo-actions button { background: white; color: #c00; border: 1px solid #fcc; }
        .photo-actions button:hover { background: #fee; }
        #status { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
        .share-box { background: #f0f7ff; border: 1px solid #cce; padding: 1rem;
                     border-radius: 6px; margin-bottom: 2rem; }
        .share-box input { width: 100%; padding: 0.5rem; box-sizing: border-box;
                           border: 1px solid #ddd; border-radius: 4px; margin-top: 0.5rem; }
        .qr-box { background: #f0f7ff; border: 1px solid #cce; padding: 1rem;
                  border-radius: 6px; margin-bottom: 2rem; }
        .qr-box p { font-size: 0.85rem; color: #666; margin: 0.25rem 0 0.75rem; }
        .qr-box a { display: inline-block; margin-top: 0.75rem; font-size: 0.85rem;
                    background: #333; color: white; padding: 0.4rem 0.8rem;
                    border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>Frames — My Album</h1>
        <button onclick="handleLogout()">Logout</button>
    </div>

    <!-- Album info -->
    <div class="album-info" id="album-info">Loading...</div>

    <!-- Share link -->
    <div class="share-box">
        <strong>Guest upload link</strong>
        <input type="text" id="share-link" readonly>
    </div>

    <!-- QR Code -->
    <div class="qr-box">
        <strong>QR Code</strong>
        <p>Print or share this — guests scan it to upload photos.</p>
        <img id="qr-img" src="" alt="QR code" style="width:200px; height:200px; display:block;">
        <a id="qr-download" download="frames-qr.png">Download QR</a>
    </div>

    <!-- Photo grid -->
    <p id="status"></p>
    <div class="photo-grid" id="photo-grid"></div>

    <script>
        let albumId = null;

        document.addEventListener("DOMContentLoaded", loadDashboard);

        async function loadDashboard() {
            // First fetch the organiser's assigned album
            const albumRes = await fetch("/my-album");

            if (!albumRes.ok) {
                document.getElementById("album-info").textContent = "No album assigned to your account yet.";
                return;
            }

            const album = await albumRes.json();
            albumId = album.id;

            // Show album details
            document.getElementById("album-info").innerHTML = `
                <strong>${album.name}</strong>
                <p>${album.description || "No description"}</p>
                <p>Date: ${album.event_date || "Not set"}</p>
            `;

            // Build the guest upload link from the slug
            const base = window.location.origin;
            document.getElementById("share-link").value = `${base}/upload/${album.slug}`;

            // Set QR code image and download link
            const qrUrl = `/albums/${album.id}/qr?t=${Date.now()}`;
            document.getElementById("qr-img").src = qrUrl;
            document.getElementById("qr-download").href = qrUrl;

            // Load the photos for this album
            loadPhotos();
        }

        async function loadPhotos() {
            const response = await fetch(`/albums/${albumId}/photos`);
            const photos = await response.json();
            const grid = document.getElementById("photo-grid");
            const status = document.getElementById("status");

            if (photos.length === 0) {
                status.textContent = "No photos uploaded yet.";
                grid.innerHTML = "";
                return;
            }

            status.textContent = `${photos.length} photo(s)`;

            // Build a card for each photo with download and delete buttons
            grid.innerHTML = photos.map(photo => `
                <div class="photo-card" id="card-${photo.id}">
                    <img src="/static/uploads/${photo.filename}" alt="photo">
                    <div class="photo-actions">
                        <a href="/static/uploads/${photo.filename}" download="${photo.filename}">
                            Download
                        </a>
                        <button onclick="deletePhoto(${photo.id})">Delete</button>
                    </div>
                </div>
            `).join("");
        }

        async function deletePhoto(photoId) {
            if (!confirm("Delete this photo?")) return;

            const response = await fetch(`/photos/${photoId}`, { method: "DELETE" });

            if (response.ok) {
                // Remove the card from the page without reloading everything
                document.getElementById(`card-${photoId}`).remove();
            } else {
                alert("Failed to delete photo.");
            }
        }

        async function handleLogout() {
            await fetch("/logout", { method: "POST" });
            window.location.href = "/";
        }
    </script>

</body>
</html>
