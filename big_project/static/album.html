<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames — Album</title>
    <link rel="stylesheet" href="/static/css/frames.css">
</head>
<body>

    <div class="top-bar">
        <a class="logo" href="/admin">
            <img src="/static/images/logo.svg" alt="Frames">
        </a>
        <nav>
            <a class="btn btn-ghost" href="/admin">← Back to admin</a>
        </nav>
    </div>

    <div class="page">

        <h1 id="album-title">Loading...</h1>
        <p id="album-subtitle"></p>

        <div class="action-row">
            <button class="btn btn-secondary" onclick="copyLink()">Copy guest link</button>
            <span class="copy-confirm" id="copy-confirm">Copied!</span>
            <a class="btn btn-secondary" id="qr-download" download="frames-qr.png">Download QR</a>
        </div>

        <p class="qr-label">Scan to upload photos</p>
        <img id="qr-img" src="" alt="QR code" style="width:160px; height:160px; display:block; margin-bottom:2rem; border-radius:8px;">

        <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;">
            <label class="file-label" style="margin:0; flex:1; text-align:left; padding:0.5rem 0.75rem;">
                Choose photos to upload
                <input type="file" id="photo-input" accept="image/*" multiple>
            </label>
            <button class="btn btn-primary" onclick="uploadPhotos()" style="white-space:nowrap;">Upload</button>
        </div>
        <p id="upload-msg" class="msg-muted" style="margin-bottom:1.5rem;"></p>

        <div class="section-header">
            <h2 id="status">Photos</h2>
        </div>

        <div class="photo-grid" id="photo-grid"></div>

    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <button class="lightbox-arrow prev" onclick="lightboxNav(-1)">‹</button>
        <img id="lightbox-img" src="" alt="Photo">
        <button class="lightbox-arrow next" onclick="lightboxNav(1)">›</button>
        <span class="lightbox-counter" id="lightbox-counter"></span>
    </div>

    <script>
        const params  = new URLSearchParams(window.location.search);
        const albumId = params.get("id");
        let shareUrl  = "";

        // ── Lightbox state ──
        let lightboxPhotos = [];
        let lightboxIndex  = 0;

        function openLightbox(index) {
            lightboxIndex = index;
            updateLightbox();
            document.getElementById("lightbox").classList.add("open");
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("open");
        }

        function lightboxNav(direction) {
            lightboxIndex = (lightboxIndex + direction + lightboxPhotos.length) % lightboxPhotos.length;
            updateLightbox();
        }

        function updateLightbox() {
            const photo = lightboxPhotos[lightboxIndex];
            document.getElementById("lightbox-img").src = `/static/uploads/${photo.filename}`;
            document.getElementById("lightbox-counter").textContent =
                `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
        }

        // Keyboard navigation
        document.addEventListener("keydown", e => {
            const lb = document.getElementById("lightbox");
            if (!lb.classList.contains("open")) return;
            if (e.key === "ArrowRight") lightboxNav(1);
            if (e.key === "ArrowLeft")  lightboxNav(-1);
            if (e.key === "Escape")     closeLightbox();
        });

        // Click outside photo to close
        document.getElementById("lightbox").addEventListener("click", e => {
            if (e.target === document.getElementById("lightbox")) closeLightbox();
        });

        // ── Album ──
        function loadAlbum() {
            fetch(`/albums/${albumId}`)
                .then(r => r.json())
                .then(album => {
                    document.getElementById("album-title").textContent = album.name;
                    document.getElementById("album-subtitle").textContent =
                        `${album.description || "No description"} — ${album.event_date || "No date"}`;
                    document.title = `Frames — ${album.name}`;
                    const qrUrl = `/albums/${albumId}/qr?t=${Date.now()}`;
                    document.getElementById("qr-img").src = qrUrl;
                    document.getElementById("qr-download").href = qrUrl;
                });

            fetch(`/qr/${albumId}`)
                .then(r => r.json())
                .then(qr => { shareUrl = `${window.location.origin}${qr.target_url}`; });
        }

        function copyLink() {
            if (!shareUrl) return;
            navigator.clipboard.writeText(shareUrl).then(() => {
                const el = document.getElementById("copy-confirm");
                el.classList.add("show");
                setTimeout(() => el.classList.remove("show"), 2000);
            });
        }

        async function uploadPhotos() {
            const fileInput = document.getElementById("photo-input");
            const msgEl = document.getElementById("upload-msg");
            if (!fileInput.files.length) { msgEl.textContent = "Please select at least one file."; return; }
            const files = Array.from(fileInput.files);
            msgEl.textContent = `Uploading ${files.length} photo(s)...`;
            let uploaded = 0;
            for (const file of files) {
                const formData = new FormData();
                formData.append("photo", file);
                const res = await fetch(`/albums/${albumId}/photos`, { method: "POST", body: formData });
                if (res.ok) uploaded++;
            }
            fileInput.value = "";
            msgEl.textContent = `${uploaded} of ${files.length} uploaded.`;
            setTimeout(() => msgEl.textContent = "", 3000);
            loadPhotos();
        }

        function loadPhotos() {
            fetch(`/albums/${albumId}/photos`)
                .then(r => r.json())
                .then(photos => {
                    const grid = document.getElementById("photo-grid");
                    const status = document.getElementById("status");
                    if (photos.length === 0) {
                        status.textContent = "Photos";
                        grid.innerHTML = '<p class="msg-muted">No photos yet.</p>';
                        return;
                    }
                    status.textContent = `${photos.length} photo(s)`;

                    // Store photos array for lightbox navigation
                    lightboxPhotos = photos;

                    grid.innerHTML = photos.map((photo, index) => `
                        <div class="photo-card" id="card-${photo.id}">
                            <img src="/static/uploads/${photo.filename}" alt="${photo.filename}"
                                 ondblclick="openLightbox(${index})" style="cursor:zoom-in;">
                            <div class="photo-actions">
                                <a href="/static/uploads/${photo.filename}" download="${photo.filename}">Download</a>
                                <button onclick="deletePhoto(${photo.id})">Delete</button>
                            </div>
                        </div>
                    `).join("");
                });
        }

        function deletePhoto(id) {
            if (!confirm("Delete this photo?")) return;
            fetch(`/photos/${id}`, { method: "DELETE" }).then(() => loadPhotos());
        }

        loadAlbum();
        loadPhotos();
    </script>
</body>
</html>
